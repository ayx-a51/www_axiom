<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FBF6EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Französisch · Nea</title>
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="manrope.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Manrope";
    src: url("manrope.woff2") format("woff2");
    font-weight: 200 800;
    font-display: optional;
  }
  :root {
    --bg: #FBF6EE;
    --surface: #FFFFFF;
    --ink: #423B33;
    --muted: #7A6F60;   /* 4.6:1 auf Creme – lesbarer Kontrast */
    --line: #EDE4D7;
    --primary: #EE6C4D;
    --primary-press: #D95B3E;
    --p-soft1: #FDE8DE;        /* helle Flächen in der Themenfarbe */
    --p-soft2: #FBDCCE;
    --p-ink: #8A5B44;          /* Text auf diesen Flächen */
    --p-edge: #F3C4B5;         /* Rahmen in der Themenfarbe */
    --accent: #1F9E92;
    --accent-soft: #E2F2F0;
    --star: #F5B942;
    --star-bg: #FDF3DC;
    --ok: #3E9B63;
    --ok-tint: #E7F4EB;
    --warn: #C98A2B;
    --warn-tint: #FBF1DD;
    --err: #D95556;
    --err-tint: #FBECEA;
    --flame: #F58A3C;
    --shadow: 0 6px 20px -8px rgba(88, 57, 24, 0.18);
    --shadow-lg: 0 14px 34px -12px rgba(88, 57, 24, 0.24);
    --r-card: 16px;
    --r-btn: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.45;
    overscroll-behavior-y: contain;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px calc(24px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .screen { display: none; flex: 1; flex-direction: column; animation: slidein 0.2s ease-out; }
  .screen.active { display: flex; }
  @keyframes slidein {
    from { opacity: 0; transform: translateX(14px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .screen.back-anim { animation: slideback 0.2s ease-out; }
  @keyframes slideback {
    from { opacity: 0; transform: translateX(-14px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ---------- generic bits ---------- */
  .iconbtn {
    width: 44px; height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 12px;
    color: var(--muted);
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .iconbtn:active { transform: scale(0.94); background: rgba(0,0,0,0.05); }
  .iconbtn svg { width: 26px; height: 26px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: var(--r-btn);
    font-weight: 700;
    font-size: 17px;
    min-height: 52px;
    padding: 10px 22px;
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
  }
  .btn:active { transform: translateY(1px) scale(0.98); }
  .btn.primary { background: var(--primary); color: #fff; box-shadow: var(--shadow); }
  .btn.primary:active { background: var(--primary-press); }
  .btn.ghost { background: transparent; color: var(--primary); border: 2px solid var(--line); }
  .btn.soft { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); box-shadow: var(--shadow); }
  .btn.okfill { background: var(--ok); color: #fff; box-shadow: var(--shadow); }
  .btn.big { min-height: 56px; font-size: 18px; }
  .btn:disabled { opacity: 0.45; pointer-events: none; }

  .card {
    background: var(--surface);
    border-radius: var(--r-card);
    box-shadow: var(--shadow);
    padding: 16px;
  }

  .screen-head {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 0 10px;
    position: sticky; top: 0; z-index: 5;
    background: linear-gradient(var(--bg) 82%, transparent);
    margin: 0 -4px; padding-left: 4px; padding-right: 4px;
  }
  .screen-head .titles { flex: 1; min-width: 0; }
  .screen-head h2 { margin: 0; font-size: 24px; font-weight: 800; line-height: 1.15; }
  .screen-head .sub { margin: 1px 0 0; font-size: 13px; color: var(--muted); }

  /* ---------- home ---------- */
  .home-top { display: flex; align-items: center; gap: 8px; padding: 2px 0 2px; }
  .home-top .spacer { flex: 1; }
  .home-head { display: flex; align-items: center; gap: 12px; padding: 6px 0 16px; }
  .home-head .logo { width: 46px; height: 46px; flex-shrink: 0; }
  .home-head .logo svg { width: 100%; height: 100%; display: block; }
  .home-head .hello { flex: 1; min-width: 0; }
  .home-head h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .home-head .sub { margin: 2px 0 0; font-size: 15px; color: var(--muted); }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 7px 13px;
    font-size: 14px; font-weight: 700; color: var(--ink);
    box-shadow: var(--shadow);
    white-space: nowrap;
  }
  .chip svg { width: 17px; height: 17px; }
  .chip .flame { color: var(--flame); }
  .chip.done { color: var(--ok); border-color: var(--ok-tint); }
  .chip .bump { display: inline-block; animation: bump 0.5s ease-out; }
  @keyframes bump { 0% {transform: scale(1);} 40% {transform: scale(1.35);} 100% {transform: scale(1);} }

  .train-card {
    background: linear-gradient(135deg, var(--p-soft1), var(--p-soft2));
    border-radius: var(--r-card);
    box-shadow: var(--shadow);
    padding: 18px;
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 14px;
  }
  .train-card .t-info { flex: 1; min-width: 0; }
  .train-card h2 { margin: 0 0 2px; font-size: 20px; font-weight: 800; }
  .train-card p { margin: 0; font-size: 14px; color: var(--p-ink); font-weight: 600; }
  .train-card .btn { flex-shrink: 0; min-width: 96px; }

  .weakbtn { width: 100%; margin-bottom: 14px; }

  .notice {
    background: var(--warn-tint);
    border-radius: var(--r-card);
    padding: 13px 15px;
    font-size: 14px; color: #7A5A1E;
    display: flex; gap: 10px; align-items: flex-start;
    margin-bottom: 14px;
  }
  .notice button { font-weight: 800; color: #7A5A1E; padding: 2px 6px; margin-left: auto; flex-shrink: 0; }

  .unit-list { display: flex; flex-direction: column; gap: 12px; }
  .unit-card {
    width: 100%;
    display: flex; align-items: center; gap: 14px;
    text-align: left;
    background: var(--surface);
    border-radius: var(--r-card);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    transition: transform 0.08s ease;
  }
  .unit-card:active { transform: translateY(1px) scale(0.99); }
  .glyph {
    width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .glyph svg { width: 28px; height: 28px; }
  .unit-card .u-info { flex: 1; min-width: 0; }
  .unit-card .u-name { font-size: 17px; font-weight: 700; }
  .unit-card .u-sub { font-size: 13px; color: var(--muted); }
  .unit-card .u-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .stars { display: inline-flex; gap: 2px; flex-shrink: 0; }
  .stars span { display: inline-flex; color: var(--star); }
  .stars span.off { color: var(--line); }
  .stars svg { width: 20px; height: 20px; }

  /* ---------- unit screen ---------- */
  .unit-hero { text-align: center; padding: 10px 0 20px; }
  .unit-hero .glyph { width: 68px; height: 68px; margin: 0 auto 10px; border-radius: 20px; }
  .unit-hero .glyph svg { width: 36px; height: 36px; }
  .unit-hero h2 { margin: 0; font-size: 26px; font-weight: 800; }
  .unit-hero .sub { margin: 2px 0 10px; font-size: 14px; color: var(--muted); }
  .unit-hero .stars svg { width: 28px; height: 28px; }
  .unit-hero .starhint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .modes { display: flex; flex-direction: column; gap: 12px; }
  .mode-btn {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border-radius: var(--r-card);
    box-shadow: var(--shadow); padding: 0 18px; min-height: 64px;
    font-size: 17px; font-weight: 700; text-align: left;
    transition: transform 0.08s ease;
  }
  .mode-btn:active { transform: translateY(1px) scale(0.99); }
  .mode-btn .m-ic {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .mode-btn .m-ic svg { width: 22px; height: 22px; }
  /* ---------- Lernziel-Auswahl ---------- */
  .g-lbl2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 22px 0 4px; }
  .sec-head {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 12px 4px 8px; font-weight: 800; font-size: 15px; color: var(--ink);
    text-align: left;
  }
  .sec-head .sec-count { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 600; }
  .plusbadge {
    font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
    background: var(--star-bg); color: #9A7414; border-radius: 6px; padding: 2px 6px;
    vertical-align: 2px;
  }
  .g-row {
    width: 100%; display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-btn);
    padding: 10px 14px; margin-bottom: 8px; text-align: left;
    transition: border-color 0.15s ease, transform 0.08s ease;
  }
  .g-row:active { transform: scale(0.99); }
  .g-row.on { border-color: var(--accent); }
  .g-row .g-info b { display: block; font-size: 15px; }
  .g-row .g-info small { font-size: 12px; color: var(--muted); }
  .cbx {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    border: 2px solid var(--line); background: var(--surface); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .cbx svg { width: 16px; height: 16px; opacity: 0; }
  .cbx.on { background: var(--accent); border-color: var(--accent); }
  .cbx.on svg { opacity: 1; }
  .cbx.some { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .cbx.some svg { opacity: 1; }
  .mode-btn:disabled { opacity: 0.45; }
  .sel-hint { font-size: 13px; color: var(--warn); font-weight: 700; margin: 10px 0 0; text-align: center; }
  .wgroup-head {
    list-style: none; font-size: 12px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--muted); padding: 12px 2px 0;
  }

  .prog-line { margin-top: 20px; }
  .prog-line .lbl { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .bar { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width 0.4s ease; }

  /* ---------- listen ---------- */
  .wlist { list-style: none; margin: 0; padding: 0 0 10px; display: flex; flex-direction: column; gap: 9px; }
  .wrow {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border-radius: var(--r-card);
    box-shadow: var(--shadow); padding: 11px 8px 11px 16px;
    text-align: left;
    min-height: 64px;
    transition: background 0.3s ease, transform 0.08s ease;
  }
  .wrow:active { transform: scale(0.995); }
  .wrow.speaking { background: var(--accent-soft); }
  .wrow .w-main { flex: 1; min-width: 0; }
  .wrow .w-fr { font-size: 18px; font-weight: 700; }
  .wrow .w-de { font-size: 14px; color: var(--muted); }
  .wrow .dots { display: flex; gap: 3px; margin-right: 2px; flex-shrink: 0; }
  .wrow .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .wrow .dots i.on { background: var(--accent); }
  .spk {
    width: 48px; height: 48px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--accent); border-radius: 50%;
    position: relative;
  }
  .spk svg { width: 25px; height: 25px; }
  .spk.speaking::before, .spk.speaking::after {
    content: ""; position: absolute; inset: 4px; border-radius: 50%;
    border: 2px solid var(--accent); opacity: 0;
    animation: ring 1.4s ease-out infinite;
  }
  .spk.speaking::after { animation-delay: 0.5s; }
  @keyframes ring {
    0% { transform: scale(0.6); opacity: 0.7; }
    100% { transform: scale(1.25); opacity: 0; }
  }
  .spk.off { color: var(--line); }

  /* ---------- flashcards ---------- */
  .cards-top { display: flex; align-items: center; padding-bottom: 4px; }
  .cards-top .count { flex: 1; text-align: center; font-weight: 800; font-size: 17px; color: var(--muted); }
  .cards-top .undo { font-size: 14px; font-weight: 700; color: var(--muted); padding: 10px 12px; visibility: hidden; }
  .cards-top .undo.show { visibility: visible; }
  .card-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; perspective: 1100px; padding: 8px 0; }
  .fcard {
    width: min(86vw, 480px);
    min-height: 300px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.3, 1.1);
    cursor: pointer;
  }
  .fcard.flipped { transform: rotateY(180deg); }
  .fcard .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--surface);
    border-radius: 20px;
    box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 26px 20px;
    border-top: 6px solid var(--tint, var(--accent));
    text-align: center;
    overflow: hidden;
  }
  .fcard .face.back { transform: rotateY(180deg); background: #F4FAF9; }
  .fcard .word { font-size: clamp(24px, 7.5vw, 38px); font-weight: 800; line-height: 1.25; overflow-wrap: break-word; max-width: 100%; }
  .fcard .face .lang-tag { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .fcard .spk { width: 54px; height: 54px; background: var(--accent-soft); }
  .card-hint { text-align: center; font-size: 13px; color: var(--muted); min-height: 20px; margin: 8px 0 0; }
  .card-actions {
    display: flex; gap: 12px; padding-top: 14px;
    visibility: hidden;
  }
  .card-actions.show { visibility: visible; animation: rise 0.22s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .card-actions .btn { flex: 1; min-height: 58px; }
  .card-actions .again { border: 2px solid var(--p-edge); color: var(--primary); background: var(--surface); }

  /* ---------- quiz ---------- */
  .quiz-top { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; }
  .segwrap { flex: 1; display: flex; align-items: center; gap: 10px; }
  .q-count { font-size: 13px; font-weight: 700; color: var(--muted); flex-shrink: 0; }
  .segbar { flex: 1; display: flex; gap: 3px; }
  .segbar i { flex: 1; min-width: 3px; height: 7px; border-radius: 3px; background: var(--line); transition: background 0.3s ease; }
  .segbar i.ok { background: var(--ok); }
  .segbar i.retry { background: var(--warn); }
  .q-area { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .q-prompt {
    background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow);
    padding: 22px 18px; text-align: center; margin-bottom: 16px;
  }
  .q-prompt .cap { font-size: 13px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .q-prompt .big { font-size: clamp(21px, 6.5vw, 30px); font-weight: 800; line-height: 1.3; }
  .q-prompt .spk { background: var(--accent-soft); margin-top: 8px; }
  .q-prompt .bigspk { width: 96px; height: 96px; border-radius: 50%; background: var(--primary); color: #fff; margin: 10px auto 4px; box-shadow: var(--shadow-lg); }
  .q-prompt .bigspk svg { width: 44px; height: 44px; }
  .q-prompt .bigspk.speaking::before, .q-prompt .bigspk.speaking::after { border-color: var(--primary); inset: -7px; }
  .q-answers { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
  .q-answers.type-wrap { margin-top: 12px; }   /* Tipp-Feld oben, die Tastatur deckt sonst alles ab */
  .ans {
    background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-btn);
    min-height: 56px; padding: 12px 16px;
    font-size: 17px; font-weight: 700; text-align: center;
    transition: transform 0.08s ease, background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    overflow-wrap: break-word;
  }
  .ans:active { transform: scale(0.985); }
  .ans.right { background: var(--ok); border-color: var(--ok); color: #fff; animation: pulse1 0.35s ease; }
  .ans.wrong { background: var(--err-tint); border-color: var(--err); color: var(--err); animation: wiggle 0.25s ease; }
  .ans.reveal { border-color: var(--ok); color: var(--ok); }
  .q-answers.locked .ans { pointer-events: none; }
  @keyframes pulse1 { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }
  @keyframes wiggle {
    0%,100% { transform: translateX(0); }
    30% { transform: translateX(-3px); }
    65% { transform: translateX(2px); }
  }

  .type-wrap { display: flex; flex-direction: column; gap: 10px; }
  .type-input {
    width: 100%;
    font: inherit; font-size: 20px; font-weight: 700;
    padding: 14px 16px;
    border: 2px solid var(--line); border-radius: var(--r-btn);
    background: var(--surface); color: var(--ink);
    text-align: center;
  }
  .type-input:focus { border-color: var(--accent); outline: none; }
  .accents { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
  .accents button {
    min-width: 44px; height: 44px;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 11px;
    font-size: 19px; font-weight: 700;
    transition: transform 0.08s ease;
  }
  .accents button:active { transform: scale(0.92); background: var(--accent-soft); }
  .type-btns { display: flex; gap: 10px; align-items: center; }
  .type-btns .btn { flex: 1; }
  .dontknow { font-size: 14px; font-weight: 700; color: var(--muted); padding: 12px; text-align: center; }

  .fb {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: none;
    justify-content: center;
  }
  .fb.show { display: flex; }
  .fb .fb-in {
    width: 100%; max-width: 560px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -10px 34px -10px rgba(88, 57, 24, 0.3);
    padding: 18px 20px calc(16px + env(safe-area-inset-bottom, 0px));
    animation: rise 0.22s ease-out;
  }
  .fb.good .fb-in { background: var(--ok-tint); }
  .fb.almost .fb-in { background: var(--warn-tint); }
  .fb.bad .fb-in { background: var(--err-tint); }
  .fb h3 { margin: 0 0 4px; font-size: 18px; font-weight: 800; }
  .fb.good h3 { color: var(--ok); }
  .fb.almost h3 { color: var(--warn); }
  .fb.bad h3 { color: #B4452F; }
  .fb .fb-body { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fb .fb-body .spk { width: 40px; height: 40px; }
  .fb .btn { width: 100%; }

  .toast {

    z-index: 50; pointer-events: none;
    opacity: 0;

    20% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.02); }

    display: flex; align-items: center; justify-content: space-between; gap: 10px;

  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 25px; height: 25px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.25); transition: left 0.2s ease; }

const BY_ID = {};

  w.id = BY_ID[w.fr] ? w.fr + ' (' + w.un + ')' : w.fr;   // stabiler Schlüssel für den Fortschritt

/* ================= Antwort-Bewertung =================

   Kästchen bewegt sich nicht, Hinweis wird gezeigt) · 'wrong'          */

function norm(s) {
  return String(s).normalize('NFC').toLowerCase()
    .replace(/[’ʼ`´]/g, "'")
    .replace(/\s*\([^)]*\)/g, ' ')
    .replace(/[.,!?;:«»""_/\-…]/g, ' ')

function stripArt(s, lang) { return s.replace(lang === 'fr' ? FR_ART : DE_ART, ''); }

// Damerau-Levenshtein (OSA), früher Abbruch bei > 1
function editDist1(a, b) {
  if (a === b) return 0;
  if (Math.abs(a.length - b.length) > 1) return 2;
  const la = a.length, lb = b.length;
  const d = [];
  for (let i = 0; i <= la; i++) { d[i] = [i]; }
  for (let j = 0; j <= lb; j++) { d[0][j] = j; }
  for (let i = 1; i <= la; i++) {
    for (let j = 1; j <= lb; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
    }
  }
  return d[la][lb];
}

// Alle normalisierten Tipp-Ziele (für Kollisionsprüfung beim Tippfehler-Bonus)
const ALL_TARGETS = { fr: new Set(), de: new Set() };
for (const w of VOCAB) {
  for (const f of w.forms) ALL_TARGETS.fr.add(fold(norm(f)));
  for (const f of w.deTargets) ALL_TARGETS.de.add(fold(norm(f)));
}

function grade(userRaw, w, lang) {
  const targets = lang === 'fr' ? w.forms : w.deTargets;
  const display = lang === 'fr' ? w.frMain : w.de;
  const u = norm(userRaw);
  if (!u) return { v: 'wrong' };
  const uf = fold(u);

  for (const t0 of targets) {
    const t = norm(t0);
    if (u === t) return { v: 'right' };
  }
  // Deutsch ohne Buch-Artikel: freiwilliger (beliebiger) Artikel ist ok
  if (lang === 'de' && !hasArt(norm(targets[0]), 'de')) {
    for (const t0 of targets) {
      if (stripArt(u, 'de') === norm(t0)) return { v: 'right' };
    }
  }
  for (const t0 of targets) {
    const t = norm(t0);
    const tf = fold(t);
    const disp = t0;   // im Hinweis die getroffene Form zeigen
    // nur Akzente/Umlaute falsch
    if (uf === tf) return { v: 'almost', note: 'Achte auf die Akzente: ' + disp };
    // Artikel vergessen
    if (hasArt(t, lang) && !hasArt(u, lang)) {
      if (u === stripArt(t, lang) || uf === fold(stripArt(t, lang))) {
        return { v: 'almost', note: 'Mit Artikel: ' + disp };
      }
    }
    // Elision/Leerzeichen (z.B. «lallemand» / «l allemand»)
    if (squash(u) === squash(t)) return { v: 'almost', note: 'Genau hinschauen: ' + disp };
    // falscher Artikel → zählt als falsch, mit gezieltem Hinweis
    if (hasArt(t, lang) && hasArt(u, lang) && stripArt(uf, lang) === stripArt(tf, lang)) {
      return { v: 'wrong', note: 'Achtung, der Artikel: ' + disp };
    }
    // kleiner Tippfehler (1 Buchstabe daneben) bei längeren Wörtern
    if (tf.length >= 6 && !ALL_TARGETS[lang].has(uf) && editDist1(uf, tf) <= 1) {
      return { v: 'almost', note: 'Kleiner Tippfehler! Richtig: ' + disp };
    }
  }
  return { v: 'wrong' };
}

/* ================= Speicher ================= */

const KEY = 'axiom.french.v1';
function freshState() {
  return {
    v: 2,
    words: {},                                     // id → {box,due,seen,right,wrong,recent,lp,ld}
    stars: {},                                     // Unité → 0..3 (Bestwert, sinkt nie)
    streak: { count: 0, last: '', rekord: 0 },
    day: { date: '', rounds: 0, cards: 0, newWords: 0 },
    hints: {},                                     // einmalige Hinweise
    settings: { name: 'Nea', sounds: true, accent: 'coral', sel: {} },
  };
}
let state = loadState();
function userName() {
  const n = String((state.settings && state.settings.name) || '').trim();
  return n || 'Nea';
}
function applyName() {
  document.title = 'Französisch · ' + userName();
}

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return freshState();
    const s = JSON.parse(raw);
    if (!s || typeof s !== 'object' || typeof s.v !== 'number') return freshState();
    if (s.v === 1) {
      // v1: Sterne waren pro Lernziel der alten flachen Liste (heute Unité 1)
      const old = s.stars || {};
      const best = Math.max(0, ...['1', 'S', '2', '3'].map(k => old[k] || 0));
      s.stars = best > 0 ? { u1: best } : {};
      s.v = 2;
    }
    if (s.v !== 2) return freshState();     // unbekannte Zukunftsversion
    const f = freshState();
    return {
      ...f, ...s,
      words: s.words || {},
      stars: s.stars || {},
      streak: { ...f.streak, ...(s.streak || {}) },
      day: { ...f.day, ...(s.day || {}) },
      hints: s.hints || {},
      settings: { ...f.settings, ...(s.settings || {}), sel: (s.settings && s.settings.sel) || {} },
    };
  } catch (e) {
    return freshState();
  }
}

/* ---------- Lernziel-Auswahl pro Unité ---------- */

function defaultSel(un) {
  return (UNITE_GROUPS[un] || []).filter(k => !GROUPS[k].plus);   // Standard: alles ohne «plus»
}
function getSel(un) {
  const raw = state.settings.sel && state.settings.sel[un];
  if (!Array.isArray(raw)) return defaultSel(un);
  return raw.filter(k => GROUPS[k] && GROUPS[k].un === un);
}
function setSel(un, arr) {
  (state.settings.sel = state.settings.sel || {})[un] = arr;
  save();
}
function selWords(un) {
  const out = [];
  for (const k of getSel(un)) out.push(...GROUPS[k].words);
  return out;
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 400);
}
function flushSave() {
  clearTimeout(saveTimer);
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* privater Modus o.ä. */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSave();
});
window.addEventListener('pagehide', flushSave);

function ws(id) {
  let s = state.words[id];
  if (!s) {
    s = { box: 0, due: todayStr(), seen: 0, right: 0, wrong: 0, recent: [], lp: '', ld: '' };
    state.words[id] = s;
  }
  return s;
}
const INTERVALS = [0, 1, 3, 7, 21];   // Tage pro Kästchen 0..4

function isDue(s) { return s.box === 0 || !s.due || s.due <= todayStr(); }
function isLearned(s) { return s.box >= 3; }
function isWeak(s) {
  if (s.seen === 0 || s.wrong === 0 || s.box > 2) return false;
  const r = s.recent;
  if (r.length >= 2 && r[r.length - 1] && r[r.length - 2]) return false;  // 2× zuletzt richtig → raus
  return r.includes(false);
}
// intoHistory=false bei einem zweiten Auftritt desselben Wortes in einer Runde:
// die Antwort zählt, verfälscht aber nicht die «knifflig»-Einschätzung.
function recordAttempt(id, ok, intoHistory) {
  const s = ws(id);
  if (s.seen === 0) {                         // Wort heute neu dazugekommen
    rollDay();
    state.day.newWords = (state.day.newWords || 0) + 1;
  }
  s.seen++;
  if (ok) s.right++; else s.wrong++;
  if (intoHistory !== false) {
    s.recent.push(ok);
    if (s.recent.length > 5) s.recent.shift();
  }
  save();
}
function promote(id) {
  const s = ws(id);
  const t = todayStr();
  if (s.lp === t) return;                    // max. 1 Aufstieg pro Tag
  if (s.box < 4) s.box++;
  s.lp = t;
  s.due = addDaysStr(INTERVALS[s.box]);      // auch Kästchen 4 neu einplanen (+21 Tage)
  save();

  const s = ws(id);
  const t = todayStr();
  if (s.ld === t) return;                    // max. 1 Abstieg pro Tag
  s.box = Math.max(0, s.box - 1);
  s.ld = t;
  s.due = todayStr();
  save();
}

/* ---------- Tag & Serie ---------- */

function rollDay() {
  const t = todayStr();
  if (state.day.date !== t) {
    state.day = { date: t, rounds: 0, cards: 0, newWords: 0 };
    save();
  }
}
// Zählt heutige Aktivität; gibt {milestone} zurück, wenn die Serie gerade gewachsen ist
function notePractice(kind) {
  rollDay();
  if (kind === 'round') state.day.rounds++;
  if (kind === 'card') state.day.cards++;
  let milestone = 0;
  const goal = state.day.rounds >= 1 || state.day.cards >= 10;
  if (goal) {
    const t = todayStr();
    const st = state.streak;
    if (st.last !== t) {
      const gap = st.last ? dayDiff(st.last, t) : Infinity;
      st.count = gap <= 2 ? st.count + 1 : 1;   // 1 Pausentag wird überbrückt
      st.last = t;
      st.rekord = Math.max(st.rekord, st.count);
      if ([3, 7, 14, 30, 50, 100].includes(st.count)) milestone = st.count;
    }
  }
  save();
  return { milestone };
}
function practicedToday() {
  return state.streak.last === todayStr();
}

/* ================= Sprachausgabe (Web Speech API) ================= */

const TTS = {
  voices: [],
  voice: null,
  none: false,          // Liste geladen, aber keine französische Stimme
  unlocked: false,
  currentU: null,
  onDone: null,
};
function scoreVoice(v) {
  const lang = (v.lang || '').toLowerCase().replace('_', '-');
  if (!/^fr(-|$)/.test(lang)) return -1;
  let s = 0;
  s += lang.startsWith('fr-fr') ? 100 : 50;
  const n = (v.name || '').toLowerCase();
  if (/natural|neural|premium|enhanced/.test(n)) s += 40;
  if (/google fran/.test(n)) s += 30;
  if (/thomas/.test(n)) s += 28;
  if (/audrey|aur[eé]lie/.test(n)) s += 26;
  if (/hortense|julie|denise|henri|eloise/.test(n)) s += 24;
  if (/am[eé]lie|chantal|paul|caroline/.test(n)) s += 18;
  if (/siri/.test(n)) s += 15;
  if (v.localService) s += 5;
  if (v.default) s += 2;
  return s;
}
function refreshVoices() {
  if (!('speechSynthesis' in window)) { TTS.none = true; return; }
  const v = speechSynthesis.getVoices();
  if (!v.length) return;
  TTS.voices = v.filter(x => scoreVoice(x) >= 0).sort((a, b) => scoreVoice(b) - scoreVoice(a));
  TTS.voice = TTS.voices[0] || null;   // beste französische Stimme als Ersatz für fehlende Aufnahmen
  const wasNone = TTS.none;
  TTS.none = TTS.voices.length === 0;
  if (wasNone !== TTS.none) {
    setTimeout(() => { if (screenNow.s === 'home') renderHome(); }, 0);
  }
}

  refreshVoices();
  if (typeof speechSynthesis.addEventListener === 'function') {
    speechSynthesis.addEventListener('voiceschanged', refreshVoices);
  }
  let tries = 0;
  const pollT = setInterval(() => {
    refreshVoices();
    if (TTS.voices.length || ++tries > 16) {
      clearInterval(pollT);
      // Liste bleibt leer → als «keine Stimme» werten (voiceschanged kann es später zurücknehmen)
      if (!TTS.voices.length) {
        TTS.none = true;
        setTimeout(() => { if (screenNow.s === 'home') renderHome(); }, 0);
      }
    }
  }, 250);

  TTS.none = true;
}
function ttsOk() {
  return 'speechSynthesis' in window && !TTS.none;
}
TTS.seq = 0;
function speak(text, opts) {

  try { speechSynthesis.cancel(); } catch (e) {}
  if (TTS.onDone) { const f = TTS.onDone; TTS.onDone = null; f(); }

  TTS.onDone = fire;

      fire();

    if (opts.onstart) u.onstart = opts.onstart;
    try { speechSynthesis.speak(u); } catch (e) { done(); }
    // Fallback, falls onend nie feuert (manche Android-Engines)
    setTimeout(() => { if (TTS.currentU === u) done(); }, Math.max(3000, text.length * 130));
  }, 60);
}

/* ---------- Abspielen der echten Aufnahmen (french/audio/*.mp3) ---------- */

const PLAYER = { el: null, stop: null, unlocked: false };

// identisch in generate-audio.mjs halten!
function audioSlug(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/œ/g, 'oe').replace(/æ/g, 'ae')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function hasFile(w) { return !!AUDIO[audioSlug(w.fr)]; }
// Kann dieses Wort (bzw. überhaupt etwas) vorgelesen werden?
function canHear(w) {
  return w ? (hasFile(w) || ttsOk()) : (Object.keys(AUDIO).length > 0 || ttsOk());
}
function stopFilePlayback() {
  if (PLAYER.el) { try { PLAYER.el.pause(); } catch (e) {} }
  if (PLAYER.stop) { const s = PLAYER.stop; PLAYER.stop = null; s(); }
}
// Hauptweg für Wort-Audio: Aufnahme, sonst Browser-Stimme
function playWord(w, opts) {
  opts = opts || {};
  if (!hasFile(w)) { speak(w.tts, opts); return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  if (TTS.onDone) { const f = TTS.onDone; TTS.onDone = null; f(); }
  stopFilePlayback();
  const el = PLAYER.el || (PLAYER.el = new Audio());
  let finished = false;
  const done = (fallback) => {
    if (finished) return;
    finished = true;
    if (PLAYER.stop === stopThis) PLAYER.stop = null;
    if (fallback) { speak(w.tts, opts); return; }
    if (opts.onend) opts.onend();
  };
  const stopThis = () => done(false);
  PLAYER.stop = stopThis;
  el.onended = () => done(false);
  el.onerror = () => done(true);            // Datei fehlt/kaputt → Browser-Stimme
  el.onplaying = opts.onstart || null;
  el.src = 'audio/' + audioSlug(w.fr) + '.mp3';
  const p = el.play();
  if (p && p.catch) p.catch(() => done(true));
}
// iOS: nach Rückkehr in den Vordergrund festgefahrene Sprachausgabe lösen
document.addEventListener('visibilitychange', () => {
  if (!('speechSynthesis' in window)) return;
  try {
    if (document.visibilityState === 'visible') { speechSynthesis.resume(); speechSynthesis.cancel(); }
    else { speechSynthesis.cancel(); }
  } catch (e) {}
});
window.addEventListener('pageshow', () => {
  try { speechSynthesis.resume(); speechSynthesis.cancel(); } catch (e) {}
});
// Erste Berührung: Sprachausgabe „aufwecken" (iOS-Geste) + Audio freischalten
document.addEventListener('pointerdown', function unlock() {
  if ('speechSynthesis' in window) {
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
    } catch (e) {}
    refreshVoices();
  }
  TTS.unlocked = true;
  if (!PLAYER.unlocked) {
    PLAYER.unlocked = true;
    try {
      const el = PLAYER.el || (PLAYER.el = new Audio());
      // stilles Mini-WAV: registriert die Nutzer-Geste für spätere play()-Aufrufe
      el.muted = true;
      el.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
      const p = el.play();
      if (p && p.catch) p.catch(() => {});
      setTimeout(() => { try { el.pause(); el.muted = false; } catch (e) {} }, 100);
    } catch (e) {}
  }
  SFX.ensure();
  document.removeEventListener('pointerdown', unlock);
});

// Sprech-Knopf-Animation an ein Element binden; w ist ein Wort-Objekt
// (Aufnahme bevorzugt) oder ein roher Text (immer Browser-Stimme)
function speakWithPulse(w, el) {
  const go = (opts) => (w && typeof w === 'object') ? playWord(w, opts) : speak(w, opts);
  if (!el) { go({}); return; }
  const row = el.closest('.wrow');
  const cleanup = () => {
    el.classList.remove('speaking');
    if (row) row.classList.remove('speaking');
  };
  go({ onend: cleanup });
  // Klassen NACH dem Start setzen, damit das Aufräumen des vorigen
  // Abspielens sie nicht gleich wieder entfernt
  el.classList.add('speaking');
  if (row) row.classList.add('speaking');
}

const SFX = {
  ctx: null,
  ensure() {
    if (!state.settings.sounds) return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  tone(freq, dur, type, delay, vol) {
    if (!state.settings.sounds || !this.ctx) return;
    try {
      const t0 = this.ctx.currentTime + (delay || 0);
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(this.ctx.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.05);
    } catch (e) {}
  },
  good() { this.ensure(); this.tone(660, 0.09); this.tone(880, 0.12, 'sine', 0.09); },
  bad() { this.ensure(); this.tone(180, 0.12, 'triangle', 0, 0.12); },
  star() { this.ensure(); this.tone(660, 0.08); this.tone(880, 0.08, 'sine', 0.08); this.tone(1174, 0.16, 'sine', 0.16); },
};

function confetti(colors) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const old = $('#confetti');
  if (old) old.remove();
  const cv = document.createElement('canvas');
  cv.id = 'confetti';
  document.body.appendChild(cv);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr;
  cv.height = innerHeight * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const cols = colors || [accentColor(), '#F5B942', '#1F9E92', '#4353A8', '#A93E72'];
  const parts = [];
  for (let i = 0; i < 120; i++) {
    parts.push({
      x: innerWidth / 2 + (Math.random() - 0.5) * innerWidth * 0.5,
      y: -20 - Math.random() * innerHeight * 0.3,
      vx: (Math.random() - 0.5) * 3,
      vy: 1.5 + Math.random() * 2.5,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.22,
      w: 7 + Math.random() * 6,
      h: 4 + Math.random() * 4,
      c: pick(cols),
    });
  }
  const t0 = performance.now();
  let raf;
  function frame(t) {
    const el = t - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.045; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.max(0, 1 - el / 2400);
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (el < 2500 && document.visibilityState === 'visible') raf = requestAnimationFrame(frame);
    else cv.remove();
  }
  raf = requestAnimationFrame(frame);
}

let noVoiceDismissed = false;

/* ---------- Runden-Planung ----------
   Knifflige Wörter kommen häufiger dran (öfter pro Runde und weiter vorne),
   neue Wörter erst, wenn die angefangenen gut genug sitzen.              */

const ROUND_TRAINING = 20;   // Fragen in einer «Los!»-Runde
const CORE_TRAINING = 12;    // ... davon verschiedene Wörter (Rest = Wiederholungen)
const ROUND_UNIT = 10;       // Fragen in einer Unité-Runde
const CORE_UNIT = 7;
const ROUND_WEAK = 15;       // Fragen in «Knifflige Wörter»
const CORE_WEAK = 8;
const ACTIVE_LIMIT = 12;     // so viele Wörter sollen gleichzeitig im Lernen sein
const NEW_PER_ROUND = 5;     // höchstens so viele neue Wörter pro Runde
const NEW_PER_DAY = 5;       // ... und pro Tag
const MAX_REP = 3;           // ein Wort höchstens 3× pro Runde

// 0 = sitzt, grösser = kniffliger
function trouble(s) {
  if (!s || s.seen === 0) return 0;
  const bad = s.recent.filter(x => !x).length;
  const ratio = s.wrong / Math.max(1, s.seen);
  return bad * 1.2 + ratio * 2 + Math.max(0, 3 - s.box) * 0.4;
}
// Reihenfolge in der Runde: knifflig und überfällig zuerst
function priority(w) {
  const s = state.words[w.id];
  if (!s || s.seen === 0) return 0;
  let p = trouble(s) * 3;
  if (isDue(s)) p += 3;
  if (s.due) p += Math.min(30, Math.max(0, dayDiff(s.due, todayStr()))) * 0.3;
  return p;
}
// wie oft darf ein Wort in einer Runde wiederholt werden
function repeatWeight(w) {
  const s = state.words[w.id];
  if (!s || s.seen === 0) return 3;              // neue Wörter brauchen Wiederholung
  return 1 + Math.min(3, trouble(s));
}
function startedWords() {
  return VOCAB.filter(w => { const s = state.words[w.id]; return s && s.seen > 0; });
}
// angefangen, aber noch nicht sicher (Kästchen < 3)
function activeWords() {
  return VOCAB.filter(w => { const s = state.words[w.id]; return s && s.seen > 0 && s.box < 3; });
}
function weakWords() {
  return VOCAB.filter(w => { const s = state.words[w.id]; return s && isWeak(s); })
    .sort((a, b) => priority(b) - priority(a));
}

// Wie viele neue Wörter dürfen heute noch dazukommen?
function newRoomToday() {
  rollDay();
  return Math.max(0, NEW_PER_DAY - (state.day.newWords || 0));
}

// Welche Wörter kommen in die nächste «Los!»-Runde?
function planTraining() {
  const started = [], fresh = [];
  for (const w of VOCAB) {
    const s = state.words[w.id];
    if (s && s.seen > 0) started.push(w); else fresh.push(w);
  }
  const byPrio = started.slice().sort((a, b) => priority(b) - priority(a));
  const dueList = byPrio.filter(w => isDue(state.words[w.id]));

  // Tempo für neue Wörter: viel Offenes → weniger Neues, aber es geht immer
  // mindestens ein Wort pro Tag weiter, damit das Buch nie stehen bleibt.
  const room = Math.max(1, ACTIVE_LIMIT - activeWords().length);
  const newN = Math.min(room, NEW_PER_ROUND, newRoomToday(), fresh.length);
  const newOnes = fresh.slice(0, newN);
  const picked = dueList.slice(0, Math.max(0, CORE_TRAINING - newOnes.length)).concat(newOnes);

  // Gibt es heute gar nichts zu tun, bleibt die Runde leer — dann zeigt die
  // Startseite «Alles erledigt» (und «Trotzdem üben» für die Übermotivierten).
  if (!picked.length) return { picked: [], newOnes: [] };

  // sonst mit noch nicht fälligen Wiederholungen auffüllen (nie mit neuen)
  for (const w of byPrio) {
    if (picked.length >= CORE_TRAINING) break;
    if (picked.indexOf(w) < 0) picked.push(w);
  }
  return { picked, newOnes };
}

// Aus den gewählten Wörtern eine Fragen-Reihenfolge bauen: knifflige und neue
// Wörter kommen mehrfach vor, aber nie direkt hintereinander.
function expandRound(picked, target) {
  if (!picked.length) return [];
  const limit = Math.max(picked.length, Math.min(target, picked.length * MAX_REP));
  const order = picked.slice().sort((a, b) => priority(b) - priority(a));
  const count = new Map(order.map(w => [w, 1]));
  let total = order.length;
  // Zusatz-Auftritte nach Gewicht verteilen: knifflige und neue Wörter
  // bekommen mehr davon als Wörter, die schon sitzen.
  while (total < limit) {
    let best = null, bestScore = 0;
    for (const w of order) {
      const c = count.get(w);
      if (c >= MAX_REP) continue;
      const score = repeatWeight(w) / c;
      if (score > bestScore) { bestScore = score; best = w; }
    }
    if (!best) break;
    count.set(best, count.get(best) + 1);
    total++;
  }
  // gierig anordnen: immer das Wort mit den meisten offenen Auftritten,
  // das nicht unter den letzten zwei Fragen war
  const out = [];
  const left = new Map(count);
  while (out.length < total) {
    const recent = out.slice(-2);
    let best = null, bestN = 0;
    for (const [w, n] of left) {
      if (n <= 0 || recent.indexOf(w) >= 0) continue;
      const score = n * 10 + priority(w);
      if (!best || score > bestN) { best = w; bestN = score; }
    }
    if (!best) {                                   // Abstand von 2 nicht möglich …
      const last = out[out.length - 1];
      for (const [w, n] of left) { if (n > 0 && w !== last) { best = w; break; } }   // … dann wenigstens nicht direkt hintereinander
      if (!best) for (const [w, n] of left) { if (n > 0) { best = w; break; } }
      if (!best) break;
    }
    left.set(best, left.get(best) - 1);
    out.push(best);
  }
  return out;
}

  const plan = planTraining();

  const weak = weakWords();
  // abgelaufene Serie nicht mehr anzeigen (gleiche Regel wie in notePractice)
  const alive = state.streak.last && dayDiff(state.streak.last, todayStr()) <= 2;
  const streakN = alive ? state.streak.count : 0;
  const doneToday = practicedToday();

  let unitsHtml = '';

    const wordsU = VOCAB.filter(w => w.un === uk);
    const learned = wordsU.filter(w => { const s = state.words[w.id]; return s && isLearned(s); }).length;
    unitsHtml +=
      '<button class="unit-card" data-unit="' + uk + '">' +
        '<span class="glyph" style="background:' + U.tint + ';color:' + U.deep + '">' + UNITE_ICON[uk] + '</span>' +
        '<span class="u-info">' +
          '<span class="u-name">' + esc(U.name) + '</span>' +
          '<span class="u-sub" style="display:block">' + esc(U.sub) + '</span>' +
          '<span class="u-meta">' + wordsU.length + ' Wörter · ' + learned + ' gelernt</span>' +
        '</span>' +
        starRow(state.stars[uk] || 0) +
      '</button>';
  }

  let trainLine = '';
  if (due.length) {
    const nQ = expandRound(due, ROUND_TRAINING).length;
    const nWeak = due.filter(w => { const s = state.words[w.id]; return s && isWeak(s); }).length;
    const nNew = plan.newOnes.length;
    trainLine = nQ + ' Fragen';
    if (nWeak) trainLine += ' · ' + nWeak + (nWeak === 1 ? ' kniffliges Wort' : ' knifflige Wörter');
    else if (nNew) trainLine += ' · ' + nNew + (nNew === 1 ? ' neues Wort' : ' neue Wörter');
  }
  const trainHtml = due.length
    ? '<div class="train-card">' +
        '<div class="t-info"><h2>Training</h2><p>' + trainLine + '</p></div>' +
        '<button class="btn primary big" id="btn-train">Los!</button>' +
      '</div>'
    : '<div class="train-card">' +
        '<div class="t-info"><h2>Training</h2><p>Alles erledigt! Komm morgen wieder.</p></div>' +
        '<button class="btn soft" id="btn-anyway">Trotzdem üben</button>' +
      '</div>';

  const weakHtml = weak.length >= 3
    ? '<button class="btn soft weakbtn" id="btn-weak">Knifflige Wörter üben (' + weak.length + ')</button>'
    : '';

  const noVoiceHtml = (TTS.none && Object.keys(AUDIO).length === 0 && !noVoiceDismissed)
    ? '<div class="notice"><span>Auf diesem Gerät gibt es keine französische Stimme – die App funktioniert trotzdem, einfach ohne Ton.</span><button id="btn-nv-ok" aria-label="Hinweis schliessen">OK</button></div>'
    : '';

  $('#scr-home').innerHTML =
    '<div class="home-top">' +
      '<span class="spacer"></span>' +
      (streakN > 0 || doneToday
        ? '<span class="chip' + (doneToday ? ' done' : '') + '" id="streak-chip">' +
            (doneToday ? IC.check : '<span class="flame">' + IC.flame + '</span>') +
            '<b>' + streakN + '</b><span>' + (streakN === 1 ? 'Tag' : 'Tage') + '</span>' +
          '</span>'
        : '') +
      '<button class="iconbtn" id="btn-settings" aria-label="Einstellungen">' + IC.gear + '</button>' +
    '</div>' +
    '<header class="home-head">' +
      '<span class="logo">' + LOGO + '</span>' +
      '<div class="hello"><h1>Salut ' + esc(userName()) + '!</h1><p class="sub">Bereit für ein bisschen Französisch?</p></div>' +
    '</header>' +
    noVoiceHtml + trainHtml + weakHtml +
    '<div class="unit-list">' + unitsHtml + '</div>';

  const bt = $('#btn-train');
  if (bt) bt.addEventListener('click', () => navTo({ s: 'quiz', mode: 'training' }));
  const ba = $('#btn-anyway');
  if (ba) ba.addEventListener('click', () => navTo({ s: 'quiz', mode: 'anyway' }));
  const bw = $('#btn-weak');
  if (bw) bw.addEventListener('click', () => navTo({ s: 'quiz', mode: 'weak' }));
  const nv = $('#btn-nv-ok');
  if (nv) nv.addEventListener('click', () => { noVoiceDismissed = true; renderHome(); });
  $('#btn-settings').addEventListener('click', openSettings);
  $$('.unit-card', $('#scr-home')).forEach(b =>
    b.addEventListener('click', () => navTo({ s: 'unit', u: b.dataset.unit })));
}

  const plusKeys = allKeys.filter(k => GROUPS[k].plus);
  const chosen = selWords(uk);
  const learned = chosen.filter(w => { const s = state.words[w.id]; return s && isLearned(s); }).length;
  const pct = chosen.length ? Math.round(learned / chosen.length * 100) : 0;
  const none = chosen.length === 0;

  const groupRow = (k) => {
    const g = GROUPS[k];
    const on = sel.has(k);
    const gl = g.words.filter(w => { const s = state.words[w.id]; return s && isLearned(s); }).length;
    return '<button class="g-row' + (on ? ' on' : '') + '" data-g="' + k + '" role="checkbox" aria-checked="' + on + '">' +
      '<span class="cbx' + (on ? ' on' : '') + '" aria-hidden="true">' + IC.check + '</span>' +
      '<span class="g-info"><b>' + esc(groupLabel(g)) + '</b><small>' + g.words.length + ' Wörter · ' + gl + ' gelernt</small></span>' +
    '</button>';

  const secHead = (label, keys, secId) => {

    '</div>' +
    '<div class="unit-hero">' +
      '<span class="glyph" style="background:' + U.tint + ';color:' + U.deep + '">' + UNITE_ICON[uk] + '</span>' +
      '<h2>' + esc(U.name) + '</h2>' +

    '</div>' +
    '<div class="modes">' +

      '<button class="mode-btn" id="m-quiz"' + (none ? ' disabled' : '') + '><span class="m-ic">' + IC.bolt + '</span>Quiz</button>' +
    '</div>' +
    (none ? '<p class="sel-hint">Wähle unten mindestens ein Lernziel.</p>' : '') +
    '<div class="sel-wrap">' +
      '<div class="g-lbl2">Was üben wir?</div>' +
      secHead('Vocabulaire', baseKeys, 'base') +
      baseKeys.map(groupRow).join('') +
      (plusKeys.length ? secHead('Vocabulaire plus', plusKeys, 'plus') + plusKeys.map(groupRow).join('') : '') +
    '</div>' +
    '<div class="prog-line">' +
      '<div class="lbl"><span>gelernt (Auswahl)</span><span>' + learned + ' von ' + chosen.length + '</span></div>' +

  $$('.g-row', $('#scr-unit')).forEach(b => b.addEventListener('click', () => {

/* ================= Lernkarten ================= */

let cards = null;

function startCards(uk) {
  const wordsU = selWords(uk);
  if (!wordsU.length) { history.back(); return; }
  const due = [], rest = [];
  for (const w of wordsU) {
    const s = state.words[w.id];
    (s && s.seen > 0 && !isDue(s) ? rest : due).push(w);
  }
  let deck = shuffle(due).concat(shuffle(rest)).slice(0, 10);
  // kein Wort doppelt hintereinander kann bei Wiedereinreihung entstehen – dort geregelt
  cards = {
    uk, deck,
    idx: 0,
    counts: {},            // id → wie oft schon gezeigt
    known: 0, again: 0,
    flipped: false,
    history: [],           // für «Zurück»
  };
  renderCard();
}

function renderCard() {
  const scr = $('#scr-cards');
  const U = UNITES[cards.uk];
  if (cards.idx >= cards.deck.length) { renderCardsEnd(); return; }
  const w = cards.deck[cards.idx];
  cards.flipped = false;
  const showHint = !state.hints.flip;

  scr.innerHTML =
    '<div class="screen-head cards-top">' +
      '<button class="iconbtn" id="c-back" aria-label="Zurück">' + IC.chevL + '</button>' +
      '<span class="count">' + (cards.idx + 1) + ' / ' + cards.deck.length + '</span>' +
      '<button class="undo' + (cards.history.length ? ' show' : '') + '" id="c-undo">Zurück</button>' +
    '</div>' +
    '<div class="card-stage">' +
      '<div class="fcard" id="fcard" style="--tint:' + U.deep + '" role="button" aria-label="Karte umdrehen" tabindex="0">' +
        '<div class="face front">' +
          '<span class="lang-tag">Französisch</span>' +
          '<span class="word" lang="fr">' + esc(w.fr) + '</span>' +
          (canHear(w) ? '<span class="spk" id="c-spk" role="button" tabindex="0" aria-label="Nochmals anhören">' + IC.speaker + '</span>' : '') +
        '</div>' +
        '<div class="face back">' +
          '<span class="lang-tag">Deutsch</span>' +
          '<span class="word">' + esc(w.de) + '</span>' +
        '</div>' +
      '</div>' +
      '<p class="card-hint" id="c-hint">' + (showHint ? 'Tippe die Karte zum Umdrehen' : '') + '</p>' +
      '<div class="card-actions" id="c-actions">' +
        '<button class="btn again" id="c-again">Nochmals üben</button>' +
        '<button class="btn okfill" id="c-known">Gewusst!</button>' +
      '</div>' +
    '</div>';

  const fc = $('#fcard');
  const flip = () => {
    if (!cards.flipped) {
      cards.flipped = true;
      fc.classList.add('flipped');
      $('#c-actions').classList.add('show');
      $('#c-hint').textContent = '';
      if (!state.hints.flip) { state.hints.flip = true; save(); }
    } else {
      cards.flipped = false;
      fc.classList.remove('flipped');
    }
  };
  fc.addEventListener('click', (e) => {
    if (e.target.closest('#c-spk')) return;
    flip();
  });
  fc.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  const spk = $('#c-spk');
  if (spk) {
    spk.addEventListener('click', (e) => { e.stopPropagation(); speakWithPulse(w, spk); });
    spk.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); speakWithPulse(w, spk); }
    });
  }
  $('#c-back').addEventListener('click', goBack);
  $('#c-undo').addEventListener('click', undoCard);
  $('#c-again').addEventListener('click', () => rateCard(false));
  $('#c-known').addEventListener('click', () => rateCard(true));

  // Wischen (nur nach dem Umdrehen)
  let px = null;
  fc.addEventListener('pointerdown', (e) => { px = e.clientX; });
  fc.addEventListener('pointerup', (e) => {
    if (px === null) return;
    const dx = e.clientX - px;
    px = null;
    if (!cards.flipped || Math.abs(dx) < Math.min(innerWidth * 0.22, 110)) return;
    rateCard(dx > 0);
  });

  // Französisch automatisch vorlesen (nach erster Berührung freigeschaltet)
  if (TTS.unlocked) speakWithPulse(w, spk);
}

function rateCard(known) {
  const w = cards.deck[cards.idx];
  const prev = JSON.parse(JSON.stringify(ws(w.id)));
  cards.history.push({ idx: cards.idx, id: w.id, prev, known, deckLen: cards.deck.length });
  recordAttempt(w.id, known);
  const streakInfo = notePractice('card');
  if (known) {
    cards.known++;
    const s = ws(w.id);
    if (s.box === 0) promote(w.id);       // Selbst-Einschätzung zählt nur fürs erste Kästchen
  } else {
    cards.again++;
    demote(w.id);
    const n = (cards.counts[w.id] || 1);
    if (n < 3) {                          // höchstens 3 Auftritte pro Runde
      const at = Math.min(cards.deck.length, cards.idx + 3 + Math.floor(Math.random() * 2));
      cards.deck.splice(at, 0, w);
    }
  }
  cards.counts[w.id] = (cards.counts[w.id] || 1) + 1;
  cards.idx++;
  if (streakInfo.milestone) { SFX.star(); confetti(); }
  renderCard();
}
function undoCard() {
  const h = cards.history.pop();
  if (!h) return;
  state.words[h.id] = h.prev;
  if (h.known) cards.known--; else {
    cards.again--;
    if (cards.deck.length > h.deckLen) {
      // wieder eingereihte Karte entfernen
      for (let i = cards.deck.length - 1; i > h.idx; i--) {
        if (cards.deck[i].id === h.id) { cards.deck.splice(i, 1); break; }
      }
    }
  }
  cards.counts[h.id] = Math.max(1, (cards.counts[h.id] || 2) - 1);
  cards.idx = h.idx;
  save();
  renderCard();
}
function renderCardsEnd() {
  const scr = $('#scr-cards');
  scr.innerHTML =
    '<div class="screen-head">' +
      '<button class="iconbtn" id="ce-back" aria-label="Zurück">' + IC.chevL + '</button>' +
      '<div class="titles"></div>' +
    '</div>' +
    '<div class="end-wrap">' +
      '<h2>Super gemacht!</h2>' +
      '<p class="end-stat">' + cards.known + ' gewusst · ' + cards.again + ' zum Üben</p>' +
      '<div class="end-btns">' +
        '<button class="btn primary big" id="ce-again">Nochmals</button>' +
        '<button class="btn ghost" id="ce-done">Fertig</button>' +
      '</div>' +
    '</div>';
  $('#ce-back').addEventListener('click', goBack);
  $('#ce-done').addEventListener('click', goBack);
  $('#ce-again').addEventListener('click', () => startCards(cards.uk));
}

/* ================= Quiz ================= */

let quiz = null;
const PRAISE = ['Richtig!', 'Genau!', 'Super!', 'Stark!', 'Parfait!', 'Très bien!', 'Bravo!'];
let lastPraise = '';

function praise() {
  let p;
  do { p = pick(PRAISE); } while (p === lastPraise && PRAISE.length > 1);
  lastPraise = p;
  return p;
}

function pickQType(w) {
  const s = state.words[w.id];
  const box = s ? s.box : 0;
  const listen = canHear(w);
  let pool;   // erster Eintrag wird bevorzugt (60%)
  if (w.cat === 'satz') {
    pool = listen ? ['listenDE', 'mcFRDE'] : ['mcFRDE'];
  } else if (box === 0) {
    // beide Auswahl-Richtungen von Anfang an; Tippen erst später
    pool = listen ? ['mcFRDE', 'mcDEFR', 'listenDE'] : ['mcFRDE', 'mcDEFR'];
  } else if (box === 1) {
    pool = listen ? ['mcDEFR', 'mcFRDE', 'listenDE'] : ['mcDEFR', 'mcFRDE'];
  } else if (box === 2) {
    pool = listen ? ['listenFR', 'mcDEFR', 'mcFRDE'] : ['mcDEFR', 'mcFRDE'];
  } else if (box === 3) {
    pool = listen ? ['typeDE', 'mcDEFR', 'listenFR'] : ['typeDE', 'mcDEFR'];
  } else {
    pool = listen ? ['typeFR', 'typeDE', 'listenDE'] : ['typeFR', 'typeDE'];
  }
  return Math.random() < 0.6 ? pool[0] : pick(pool);
}

function sameMeaning(a, b) { return norm(a.de) === norm(b.de); }

function pickDistractors(w, side, n) {
  const val = x => side === 'de' ? x.de : x.frMain;
  const seen = new Set([norm(val(w))]);
  const ok = x => {
    const v = norm(val(x));
    if (seen.has(v) || sameMeaning(w, x)) return false;
    seen.add(v);
    return true;
  };
  const tiers = [
    VOCAB.filter(x => x !== w && x.cat === w.cat && x.un === w.un),
    VOCAB.filter(x => x !== w && x.cat === w.cat),
    VOCAB.filter(x => x !== w && x.un === w.un),
    VOCAB.filter(x => x !== w),
  ];
  const out = [];
  for (const tier of tiers) {
    for (const x of shuffle(tier)) {
      if (out.length >= n) break;
      if (ok(x)) out.push(x);
    }
    if (out.length >= n) break;
  }
  // Bei Französisch-Optionen: Artikel soll die Antwort nicht verraten
  if (side === 'fr') {
    const art = (norm(val(w)).match(FR_ART) || [''])[0];
    if (art && !out.some(x => norm(val(x)).startsWith(art))) {
      const swap = VOCAB.find(x => x !== w && !out.includes(x) && norm(val(x)).startsWith(art) && !sameMeaning(w, x) && !seen.has(norm(val(x))));
      if (swap && out.length) out[out.length - 1] = swap;
    }
  }
  return out.map(val);
}

function startQuiz(mode, uk) {
  let picked, target;
  if (mode === 'unit') {
    const wordsU = selWords(uk);
    const due = wordsU.filter(w => { const s = state.words[w.id]; return !s || isDue(s); });
    const rest = wordsU.filter(w => due.indexOf(w) < 0);
    picked = shuffle(due).sort((a, b) => priority(b) - priority(a)).concat(shuffle(rest)).slice(0, CORE_UNIT);
    target = ROUND_UNIT;
  } else if (mode === 'weak') {
    picked = weakWords().slice(0, CORE_WEAK);
    target = ROUND_WEAK;
  } else if (mode === 'anyway') {
    picked = startedWords().sort((a, b) => priority(b) - priority(a)).slice(0, CORE_TRAINING);
    if (!picked.length) picked = VOCAB.slice(0, NEW_PER_ROUND);
    target = ROUND_TRAINING;
  } else {
    picked = planTraining().picked;
    // «Nochmals» direkt nach einer sauberen Runde: nichts mehr fällig →
    // trotzdem eine Runde aus den schwächsten Wörtern statt zurück zur Startseite
    if (!picked.length) picked = startedWords().sort((a, b) => priority(b) - priority(a)).slice(0, CORE_TRAINING);
    target = ROUND_TRAINING;
  }
  const words = expandRound(picked, target);
  if (!words.length) { history.back(); return; }

  if (quiz && quiz.timer) clearTimeout(quiz.timer);
  quiz = {
    mode, uk,
    queue: words.map((w, i) => ({ w, type: pickQType(w), seg: i, retry: false })),
    idx: 0,
    len: words.length,
    segs: new Array(words.length).fill(''),   // '' | 'ok' | 'retry'
    firstTry: 0,
    misses: [],                               // Wörter mit Fehlversuch (für die Zusammenfassung)
    asked: new Set(),                         // welche Wörter in dieser Runde schon dran waren
    locked: false,
  };
  renderQuestion();
}

function segbarHtml() {
  // Nenner ist die echte Warteschlange: Nachfragen zählen mit, damit nie
  // «20 / 20» steht, während noch Fragen kommen.
  const total = quiz.queue.length;
  const done = Math.min(quiz.idx, total);
  return '<div class="segwrap">' +
    '<div class="segbar" aria-hidden="true">' + quiz.segs.map(s => '<i class="' + s + '"></i>').join('') + '</div>' +
    '<span class="q-count">' + done + ' / ' + total + '</span>' +
  '</div>';
}

function renderQuestion() {
  const scr = $('#scr-quiz');
  hideFeedback();
  if (quiz.idx >= quiz.queue.length) { renderQuizEnd(); return; }
  const q = quiz.queue[quiz.idx];
  const w = q.w;
  quiz.locked = false;
  quiz.timer = null;
  quiz.shownAt = Date.now();
  // Hör-Frage, aber Audio inzwischen nicht (mehr) verfügbar → gleiche Seite als Lese-Frage
  if (q.type.startsWith('listen') && !canHear(w)) {
    q.type = q.type === 'listenDE' ? 'mcFRDE' : 'mcDEFR';
  }

  let promptHtml = '';
  let answersHtml = '';
  const spkBtn = (id, big) => canHear(w)
    ? '<span class="spk' + (big ? ' bigspk' : '') + '" id="' + id + '" role="button" tabindex="0" aria-label="Anhören">' + IC.speaker + '</span>'
    : (big ? '<span class="spk bigspk off" aria-hidden="true">' + IC.speaker + '</span>' : '');

  if (q.type === 'mcFRDE' || q.type === 'typeDE') {
    promptHtml =
      '<div class="q-prompt">' +
        '<div class="cap">' + (q.type === 'mcFRDE' ? 'Was heisst das?' : 'Schreibe auf Deutsch:') + '</div>' +
        '<div class="big" lang="fr">' + esc(w.fr) + '</div>' + spkBtn('q-spk') +
      '</div>';
  } else if (q.type === 'mcDEFR' || q.type === 'typeFR') {
    promptHtml =
      '<div class="q-prompt">' +
        '<div class="cap">' + (q.type === 'mcDEFR' ? 'Wie heisst das auf Französisch?' : 'Schreibe auf Französisch:') + '</div>' +
        '<div class="big">' + esc(w.de) + '</div>' +
      '</div>';
  } else { // listenDE / listenFR
    promptHtml =
      '<div class="q-prompt">' +
        '<div class="cap">Was hörst du?</div>' + spkBtn('q-spk', true) +
      '</div>';
  }

  if (q.type === 'mcFRDE' || q.type === 'mcDEFR' || q.type === 'listenDE' || q.type === 'listenFR') {
    const side = (q.type === 'mcFRDE' || q.type === 'listenDE') ? 'de' : 'fr';
    const correct = side === 'de' ? w.de : w.frMain;
    const opts = shuffle(pickDistractors(w, side, 3).concat([correct]));
    q.correct = correct;
    answersHtml = '<div class="q-answers" id="q-answers">' +
      opts.map(o => '<button class="ans"' + (side === 'fr' ? ' lang="fr"' : '') + ' data-v="' + esc(o) + '">' + esc(o) + '</button>').join('') +
      '</div>';
  } else {
    const isFr = q.type === 'typeFR';
    const accents = isFr
      ? '<div class="accents" id="q-accents">' +
        ['é', 'è', 'ê', 'à', 'â', 'ç', 'ô', 'û', 'î', '’'].map(c => '<button type="button" data-c="' + c + '">' + c + '</button>').join('') +
        '</div>'
      : '';
    answersHtml =
      '<div class="q-answers type-wrap">' +
        '<input class="type-input" id="q-input" type="text" ' +
          'autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" enterkeyhint="done"' +
          (isFr ? ' lang="fr"' : ' lang="de"') + ' aria-label="Deine Antwort">' +
        accents +
        '<div class="type-btns"><button class="btn primary" id="q-check">Prüfen</button></div>' +
        '<button class="dontknow" id="q-dontknow">Weiss ich nicht</button>' +
      '</div>';
  }

  scr.innerHTML =
    '<div class="quiz-top">' +
      '<button class="iconbtn" id="q-x" aria-label="Quiz beenden">' + IC.x + '</button>' +
      segbarHtml() +
    '</div>' +
    '<div class="q-area">' + promptHtml + answersHtml + '</div>';

  $('#q-x').addEventListener('click', goBack);
  const spk = $('#q-spk');
  if (spk) {
    spk.addEventListener('click', () => speakWithPulse(w, spk));
    spk.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); speakWithPulse(w, spk); } });
  }
  if (q.type.startsWith('listen') && TTS.unlocked) speakWithPulse(w, spk);

  const ansWrap = $('#q-answers');
  if (ansWrap) {
    $$('.ans', ansWrap).forEach(b => b.addEventListener('click', () => answerMC(q, b)));
  }
  const input = $('#q-input');
  if (input) {
    const check = () => answerTyped(q, input.value);
    $('#q-check').addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
    $('#q-dontknow').addEventListener('click', () => answerTyped(q, null));
    const acc = $('#q-accents');
    if (acc) {
      $$('button', acc).forEach(b => b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const c = b.dataset.c;
        const st = input.selectionStart == null ? input.value.length : input.selectionStart;
        input.setRangeText(c, st, input.selectionEnd == null ? st : input.selectionEnd, 'end');
        input.focus();
      }));
    }
    setTimeout(() => { try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); } }, 250);
  }
}

function applyResult(q, verdict) {
  // Buchhaltung + Leitner; gibt zurück, ob die Runde das als «beim ersten Versuch richtig» zählt
  const id = q.w.id;
  const counted = verdict !== 'wrong';
  const firstThisRound = !quiz.asked.has(id);
  quiz.asked.add(id);
  recordAttempt(id, counted, firstThisRound);
  if (!q.retry) {
    if (counted) {
      quiz.firstTry++;
      quiz.segs[q.seg] = 'ok';
      if (verdict === 'right') {
        const s = ws(id);
        if (isDue(s)) promote(id);
      }
    } else {
      quiz.segs[q.seg] = 'retry';
      quiz.misses.push(q.w);
      demote(id);
      // gleiche Frage etwas später nochmals
      const at = Math.min(quiz.queue.length, quiz.idx + 2 + Math.floor(Math.random() * 3));
      quiz.queue.splice(at, 0, { w: q.w, type: q.type, seg: q.seg, retry: true });
    }
  } else if (!counted) {
    demote(id);
  }
  refreshSegbar();
}
function refreshSegbar() {
  const bar = $('.segwrap', $('#scr-quiz'));
  if (bar) bar.outerHTML = segbarHtml();
}

function answerMC(q, btn) {
  if (quiz.locked) return;
  if (Date.now() - (quiz.shownAt || 0) < 300) return;   // Doppel-Tipp vom «Weiter» abfangen
  quiz.locked = true;
  const wrap = $('#q-answers');
  wrap.classList.add('locked');
  const isRight = btn.dataset.v === q.correct;
  applyResult(q, isRight ? 'right' : 'wrong');
  if (isRight) {
    btn.classList.add('right');
    SFX.good();
    showToast(praise());
    quiz.timer = setTimeout(nextQuestion, 650);
  } else {
    btn.classList.add('wrong');
    SFX.bad();
    $$('.ans', wrap).forEach(b => { if (b.dataset.v === q.correct) b.classList.add('reveal'); });
    showFeedback('bad', 'Nicht ganz.', fbPair(q.w), null);
  }
}

function answerTyped(q, valueOrNull) {
  if (quiz.locked) return;
  if (Date.now() - (quiz.shownAt || 0) < 300) return;       // Doppel-Tipp vom «Weiter» abfangen
  if (valueOrNull !== null && !norm(valueOrNull)) return;   // leeres Feld: nichts tun
  quiz.locked = true;
  const lang = q.type === 'typeFR' ? 'fr' : 'de';
  if (valueOrNull === null) {
    applyResult(q, 'wrong');
    SFX.bad();
    showFeedback('bad', 'Kein Problem!', fbPair(q.w), null);
    return;
  }
  const res = grade(valueOrNull, q.w, lang);
  applyResult(q, res.v);
  if (res.v === 'right') {
    SFX.good();
    showToast(praise());
    quiz.timer = setTimeout(nextQuestion, 650);
  } else if (res.v === 'almost') {
    SFX.good();
    showFeedback('almost', 'Fast perfekt!', esc(res.note), null);
  } else {
    SFX.bad();
    showFeedback('bad', 'Nicht ganz.' + (res.note ? ' ' + esc(res.note) : ''), fbPair(q.w), null);
  }
}

function fbPair(w) {
  return 'Richtig ist: <b lang="fr">«' + esc(w.frMain) + '»</b> – ' + esc(w.de);
}

function nextQuestion() {
  if (!quiz || screenNow.s !== 'quiz') return;   // Quiz wurde inzwischen verlassen
  quiz.idx++;
  renderQuestion();
}

/* ---------- Feedback-Leiste & Toast ---------- */

function showFeedback(kind, title, bodyHtml, note) {
  // Tastatur schliessen, sonst verdeckt sie die Leiste (iOS/Android)
  const ae = document.activeElement;
  if (ae && ae.tagName === 'INPUT') ae.blur();
  const q = quiz && quiz.queue[quiz.idx];
  const fb = $('#fb');
  const spk = (q && canHear(q.w))
    ? '<span class="spk" id="fb-spk" role="button" tabindex="0" aria-label="Anhören">' + IC.speaker + '</span>'
    : '';
  fb.className = 'fb show ' + kind;
  fb.innerHTML =
    '<div class="fb-in">' +
      '<h3>' + title + '</h3>' +
      '<p class="fb-body"><span>' + bodyHtml + '</span>' + spk + '</p>' +
      (note ? '<p class="fb-body">' + note + '</p>' : '') +
      '<button class="btn primary" id="fb-next">Weiter</button>' +
    '</div>';
  const fspk = $('#fb-spk');
  if (fspk && q) {
    fspk.addEventListener('click', () => speakWithPulse(q.w, fspk));
    fspk.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); speakWithPulse(q.w, fspk); }
    });
    if (TTS.unlocked) speakWithPulse(q.w, fspk);
  }
  $('#fb-next').addEventListener('click', () => { hideFeedback(); nextQuestion(); });
}
function hideFeedback() {
  const fb = $('#fb');
  fb.className = 'fb';
  fb.innerHTML = '';
}
function showToast(text) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  // bei reduzierter Bewegung läuft keine Animation → Klasse zeitgesteuert entfernen
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 850);
}

/* ---------- Rundenende ---------- */

function renderQuizEnd() {
  const scr = $('#scr-quiz');
  const total = quiz.len;
  const first = quiz.firstTry;
  const pct = total ? first / total : 0;

  let starHtml = '';
  let newStar = false;
  let stars = 0;
  if (quiz.mode === 'unit') {
    stars = pct >= 0.9 ? 3 : pct >= 0.65 ? 2 : 1;
    const prevStars = state.stars[quiz.uk] || 0;
    if (stars > prevStars) { state.stars[quiz.uk] = stars; newStar = true; save(); }
    starHtml = '<div class="end-stars">' +
      [1, 2, 3].map(i => '<span class="' + (i <= stars ? 'on' : '') + '" style="display:inline-flex">' + IC.star + '</span>').join('') +
      '</div>';
  }

  const streakInfo = notePractice('round');
  const firstRoundToday = state.day.rounds === 1;
  const perfect = first === total && total > 0;

  const missUnique = [];
  for (const w of quiz.misses) if (!missUnique.includes(w)) missUnique.push(w);
  let recap = '';
  if (missUnique.length) {
    recap = '<div class="recap"><h4>Diese Wörter üben wir nochmals:</h4><ul class="wlist">' +
      missUnique.map(w =>
        '<li><button class="wrow" data-id="' + esc(w.id) + '">' +
          '<span class="w-main">' +
            '<span class="w-fr" lang="fr" style="display:block">' + esc(w.fr) + '</span>' +
            '<span class="w-de" style="display:block">' + esc(w.de) + '</span>' +
          '</span>' +
          '<span class="spk' + (canHear(w) ? '' : ' off') + '" aria-hidden="true">' + IC.speaker + '</span>' +
        '</button></li>').join('') +
      '</ul></div>';
  }

  scr.innerHTML =
    '<div class="quiz-top">' +
      '<button class="iconbtn" id="qe-x" aria-label="Schliessen">' + IC.x + '</button>' +
      segbarHtml() +
    '</div>' +
    '<div class="end-wrap">' +
      '<h2>Fertig!</h2>' + starHtml +
      '<p class="end-stat">' + first + ' von ' + total + ' beim ersten Versuch</p>' +
      (firstRoundToday && state.streak.count > 0
        ? '<p class="end-streak"><span class="bump" style="display:inline-block">🔥</span> Serie: ' +
          state.streak.count + (state.streak.count === 1 ? ' Tag!' : ' Tage!') + '</p>'
        : '') +
      recap +
      '<div class="end-btns">' +
        '<button class="btn primary big" id="qe-again">Nochmals</button>' +
        '<button class="btn ghost" id="qe-done">Fertig</button>' +
      '</div>' +
    '</div>';

  $('#qe-x').addEventListener('click', goBack);
  $('#qe-done').addEventListener('click', goBack);
  $('#qe-again').addEventListener('click', () => startQuiz(quiz.mode, quiz.uk));
  $$('.recap .wrow', scr).forEach(b => {
    b.addEventListener('click', () => {
      const w = BY_ID[b.dataset.id];
      if (w) speakWithPulse(w, $('.spk', b));
    });
  });

  if (perfect || (newStar && stars === 3) || streakInfo.milestone) {
    SFX.star();
    const tint = quiz.uk ? [UNITES[quiz.uk].deep, UNITES[quiz.uk].tint, '#F5B942', accentColor()] : null;
    setTimeout(() => confetti(tint), 350);
  } else if (newStar) {
    SFX.star();
  }
}

/* ================= Einstellungen ================= */

const ACCENTS = {
  coral: { c: '#EE6C4D', p: '#D95B3E', s1: '#FDE8DE', s2: '#FBDCCE', ink: '#8A5B44', edge: '#F3C4B5' },
  teal:  { c: '#1F9E92', p: '#177E74', s1: '#DDF2EF', s2: '#C6E8E3', ink: '#1B665F', edge: '#A5D9D3' },
  peri:  { c: '#4353A8', p: '#37458C', s1: '#E5E9F9', s2: '#D2D9F1', ink: '#3A4682', edge: '#B7C2E9' },
  rose:  { c: '#A93E72', p: '#8E325F', s1: '#FAE3EE', s2: '#F5D1E2', ink: '#7C2C53', edge: '#E7B5CD' },
};
function applyAccent() {
  const a = ACCENTS[state.settings.accent] || ACCENTS.coral;
  const r = document.documentElement.style;
  r.setProperty('--primary', a.c);
  r.setProperty('--primary-press', a.p);
  r.setProperty('--p-soft1', a.s1);
  r.setProperty('--p-soft2', a.s2);
  r.setProperty('--p-ink', a.ink);
  r.setProperty('--p-edge', a.edge);
}
function accentColor() {
  return (ACCENTS[state.settings.accent] || ACCENTS.coral).c;
}

let confirmDelete = false;

function openSettings() {
  confirmDelete = false;
  renderSettings();
  $('#backdrop').classList.add('show');
  $('#sheet').classList.add('show');
  // Marker-Eintrag, damit die System-Zurück-Geste das Blatt schliesst statt die App zu verlassen
  history.pushState({ s: screenNow.s, u: screenNow.u, sheet: 1 }, '');
}
function hideSheet() {
  $('#backdrop').classList.remove('show');
  $('#sheet').classList.remove('show');
  if (screenNow.s === 'home') renderHome();
}
function closeSettings() {
  history.back();   // popstate ruft hideSheet()
}
function renderSettings() {
  const sheet = $('#sheet');
  sheet.innerHTML =
    '<div class="grab"></div>' +
    '<h3>Einstellungen</h3>' +
    '<div class="set-group"><div class="g-lbl">Name</div>' +
      '<input class="name-input" id="set-name" type="text" maxlength="20" ' +
        'autocomplete="off" spellcheck="false" aria-label="Dein Name" value="' + esc(userName()) + '">' +
      '<p class="set-note">So begrüsst dich die App.</p>' +
    '</div>' +
    '<div class="set-group"><div class="g-lbl">Töne</div>' +
      '<div class="set-row"><span>Quiz-Töne</span>' +
        '<button class="switch' + (state.settings.sounds ? ' on' : '') + '" id="sw-sounds" role="switch" aria-checked="' + state.settings.sounds + '" aria-label="Quiz-Töne"></button>' +
      '</div>' +
      '<p class="set-note">Kein Ton? Prüfe den Stummschalter und die Lautstärke deines Geräts.</p>' +
    '</div>' +
    '<div class="set-group"><div class="g-lbl">Farbe</div>' +
      '<div class="swatches">' +
        Object.entries(ACCENTS).map(([k, a]) =>
          '<button class="swatch' + (state.settings.accent === k ? ' sel' : '') + '" data-a="' + k + '" style="background:' + a.c + '" aria-label="Farbe ' + k + '"></button>'
        ).join('') +
      '</div>' +
    '</div>' +
    '<div class="set-group"><div class="g-lbl">Fortschritt</div>' +
      '<div class="set-row"><span>Längste Serie</span><span>' + state.streak.rekord + ' ' + (state.streak.rekord === 1 ? 'Tag' : 'Tage') + '</span></div>' +
      (confirmDelete
        ? '<p class="set-note danger" style="margin-top:12px">Wirklich den ganzen Fortschritt löschen?</p>' +
          '<div class="confirm-row">' +
            '<button class="btn ghost" id="del-no">Abbrechen</button>' +
            '<button class="btn dangerfill" id="del-yes">Löschen</button>' +
          '</div>'
        : '<button class="dontknow danger" id="del-ask" style="width:100%;margin-top:6px">Fortschritt löschen</button>') +
    '</div>' +
    '<button class="btn soft" id="sheet-close" style="width:100%">Fertig</button>';

  const nameEl = $('#set-name');
  nameEl.addEventListener('input', () => {
    state.settings.name = nameEl.value.slice(0, 20);
    save();
    applyName();
  });
  nameEl.addEventListener('blur', () => { nameEl.value = userName(); });
  nameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameEl.blur(); });
  $('#sw-sounds').addEventListener('click', () => {
    state.settings.sounds = !state.settings.sounds;
    save();
    if (state.settings.sounds) SFX.good();
    renderSettings();
  });
  $$('.swatch', sheet).forEach(b => {
    b.addEventListener('click', () => {
      state.settings.accent = b.dataset.a;
      save();
      applyAccent();
      renderSettings();
    });
  });
  const da = $('#del-ask');
  if (da) da.addEventListener('click', () => { confirmDelete = true; renderSettings(); });
  const dn = $('#del-no');
  if (dn) dn.addEventListener('click', () => { confirmDelete = false; renderSettings(); });
  const dy = $('#del-yes');
  if (dy) dy.addEventListener('click', () => {
    const settings = state.settings;
    state = freshState();
    state.settings = settings;
    flushSave();
    confirmDelete = false;
    renderSettings();
  });
  $('#sheet-close').addEventListener('click', closeSettings);
}
$('#backdrop').addEventListener('click', closeSettings);

/* ================= Start ================= */

rollDay();
applyAccent();
applyName();
renderHome();
showScreen({ s: 'home', u: null });
history.replaceState({ s: 'home', u: null }, '');

};
